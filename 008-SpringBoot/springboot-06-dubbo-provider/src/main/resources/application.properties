#内嵌springboot端口号
server.port=8081
#设置上下文根
server.servlet.context-path=/

#设置mysql数据库连接信息
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.8.128:3306/springboot?useUnicode=true&characterEncoding=UTF-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=root

#设置dubbo配置
spring.application.name=14-springboot-dubbo-ssm-provider
#声明当前工程为提供者
spring.dubbo.server=true
#设置注册中心
spring.dubbo.registry=zookeeper://192.168.8.128:2181

#设置redis数据库连接信息
spring.redis.host=192.168.8.128
spring.redis.port=6379
