server:
  port: 80

spring:
  application:
    name: springcloud-config-consumer
  cloud:
    config:
      label: master #分支名称
      name: config #配置文件名称
      profile: dev #读取后缀名称   上述3个综合：master分支上config-dev.yml的配置文件被读取http://config3344.com:3344/master/config-dev.yml
      uri: http://localhost:3344 #配置中心地址
#  rabbitmq: #rabbitmq配置
#    host: 192.168.8.128
#    port: 5672
#    username: root
#    password: root

eureka:
  client:
    service-url:
      defaultZone: http://eureka7001.com:7001/eureka
  instance:
      instance-id: 80

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: "*"
