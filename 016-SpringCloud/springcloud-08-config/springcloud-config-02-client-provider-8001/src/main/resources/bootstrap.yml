server:
  port: 8001

spring:
  application:
    name: springcloud-config-provider   #微服务名称，集群下相同提供者微服务名称相同
  datasource:   #配置数据库
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/springcloud?useUnicode=true&characterEncoding=utf-8&useSSL=false&&serverTimezone=UTC
    username: root
    password: 1220.dbggl.mysql
  cloud:
    config:
      label: master #分支名称
      name: config #配置文件名称
      profile: dev #读取后缀名称   上述3个综合：master分支上config-dev.yml的配置文件被读取http://config3344.com:3344/master/config-dev.yml
      uri: http://localhost:3344 #配置中心地址
#  rabbitmq: #rabbitmq配置
#    host: 192.168.8.128
#    port: 5672
#    username: root
#    password: root

eureka:
  client:
    service-url:
      defaultZone: http://eureka7001.com:7001/eureka
  instance:
      instance-id: 8001

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: "*"

#配置mybatis
mybatis:
  mapperLocations: classpath:mapper/*.xml
  type-aliases-package: com.huangjiabin.entity    # 所有Entity别名类所在包
