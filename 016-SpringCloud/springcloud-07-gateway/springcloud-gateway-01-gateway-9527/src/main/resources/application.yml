server:
  port: 9527
spring:
  application:
    name: springcloud-gateway
  cloud:
    gateway:
      routes:
#        - id: payment_routh                #这一段是普通路由，下面的为动态路由
#          uri: http://localhost:8001
#          predicates:
#            - Path=/payment/get/**
#        - id: payment_routh
#          uri: http://localhost:8001
#          predicates:
#            - Path=/payment/feign/timeout

        - id: payment_routh                #路由的ID，没有固定规则但要求唯一（测试不唯一也行），建议配合服务名
          uri: lb://springcloud-eureka-provider          #匹配后提供服务的路由地址
          predicates:
            - Path=/payment/get/**         # 断言，路径相匹配的进行路由
            #- After=2023-03-03T16:07:03.685+08:00[Asia/Shanghai]    # 断言，时间后匹配
            #- Before=2023-03-03T16:11:03.685+08:00[Asia/Shanghai]   # 断言，时间前匹配
            #- Between=2023-03-03T16:07:03.685+08:00[Asia/Shanghai],2023-03-03T16:11:03.685+08:00[Asia/Shanghai] # 断言，时间区间内匹配
            #- Cookie=username,zzyy  #cookie断言，逗号前面是cookie的key,后面是cookie的值匹配的正则
            #- Header=X-Request-Id, \d+  #请求头断言
            #- Host=huang.jia.bin   # 不晓得啥子断言
            #- Method=GET    #请求类型断言，必须是get请求
            #- Query=username,\d+  # 请求参数断言要有参数名username并且值还要是整数才能路由
        - id: payment_routh
          uri: lb://springcloud-eureka-provider
          predicates:
            - Path=/payment/feign/timeout

eureka:
  instance:
    instance-id: 9527
    hostname: cloud-gateway-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka7001.com:7001/eureka
