langchain4j:
  open-ai:
    chat-model:
      api-key: sk-1e1a5e1570454cff9c090e6661ba219a
      model-name: deepseek-v4-flash
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    streaming-chat-model:
      api-key: sk-1e1a5e1570454cff9c090e6661ba219a
      model-name: deepseek-v4-flash
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      log-requests: true
      log-responses: true
    # 图片描述用的视觉模型（必须是视觉理解模型，如 qwen3-vl-plus / qwen-vl-max；
    # 纯文本、向量模型会报 404；qwen-image-* 是文生图模型，走 chat 接口会长时间无响应导致读超时）
    # 未配置 api-key / base-url 时默认复用上面 chat-model 的配置
    vision-model:
      model-name: qwen3.8-omni-flash
      # 单次请求超时（秒）：langchain4j 默认读超时仅 60s，大图生成描述可能不够
      timeout-seconds: 180